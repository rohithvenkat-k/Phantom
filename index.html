<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHANTOM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- In-Game HUD -->
    <div id="hud" class="hidden">
      <div id="hud-left">
        <span id="wave-display">WAVE 1 / 7</span>
        <span id="hearts-display">❤❤❤</span>
        <span id="weapon-display">WEAPON: RIFLE</span>
      </div>
      <div id="hud-right">
        <span id="kill-display">KILLS: 0</span>
        <button id="pause-btn">PAUSE</button>
      </div>
    </div>

    <!-- UI Overlay Windows -->
    <div id="ui-overlay">
      <!-- Tactical Cheat Alert Banner -->
      <div id="cheat-banner" class="hidden"></div>

      <!-- Tactical Cheat Console Modal (Triggered by '\') -->
      <div id="cheat-console-modal" class="modal hidden">
        <h2 class="console-title">TACTICAL COMMAND TERMINAL</h2>
        <p class="console-sub">ENTER AUTHORIZATION KEY // PRESS ENTER TO DEPLOY // ESC TO ABORT</p>
        <input 
          type="text" 
          id="cheat-input" 
          placeholder="ENTER KEYCODE..." 
          autocomplete="off" 
          spellcheck="false" 
        />
      </div>

      <!-- 1. Home Menu -->
      <div id="home-screen" class="modal">
        <h1 class="glitch-title">PHANTOM</h1>
        <p class="tagline">ONE BULLET. ONE KEYSTROKE.</p>
        <div class="menu-actions">
          <button id="btn-play">PLAY</button>
          <button id="btn-settings">SETTINGS</button>
        </div>
      </div>

      <!-- 2. Settings Menu -->
      <div id="settings-screen" class="modal hidden">
        <h2>OPERATIONAL SETTINGS</h2>
        <div class="setting-item">
          <label>AUDIO SFX</label>
          <button id="toggle-audio">ENABLED</button>
        </div>
        <div class="setting-item">
          <label>BLOOD / GORE</label>
          <button id="toggle-blood">ENABLED</button>
        </div>
        <button id="btn-back-settings">BACK</button>
      </div>

      <!-- 3. Story Cutscene (Before Wave 1) -->
      <div id="story-screen" class="modal hidden">
        <div id="story-text"></div>
        <button id="btn-start-wave" class="hidden">ENGAGE</button>
      </div>

      <!-- 4. Pause Screen -->
      <div id="pause-screen" class="modal hidden">
        <h2>TACTICAL PAUSE</h2>
        <div class="menu-actions">
          <button id="btn-resume">RESUME</button>
          <button id="btn-restart">RESTART</button>
          <button id="btn-quit">QUIT TO MENU</button>
        </div>
      </div>

      <!-- 5. Game Over Screen -->
      <div id="game-over-screen" class="modal hidden">
        <h2 id="game-over-title">SYSTEM CASUALTY</h2>
        <p id="game-over-stats"></p>
        <button id="btn-retry">RETRY</button>
      </div>

      <!-- 6. Ending Outro Cutscene (After Wave 7) -->
      <div id="outro-screen" class="modal hidden">
        <div id="outro-text"></div>
        <button id="btn-outro-home" class="hidden">RETURN TO TITLE</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
